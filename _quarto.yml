project:
  type: website
  output-dir: docs
  # Se copia a docs/ en cada render: GitHub Pages lo necesita
  # para no procesar el sitio con Jekyll (si no, ignora site_libs/)
  resources:
    - .nojekyll

website:
  title: "Rafael Neira"
  description: "Apuntes de clase"
  site-url: https://rneiraa.github.io/blog
  navbar:
    left:
      - href: index.qmd
        text: Inicio
      - href: econometria.qmd
        text: Econometría
      - href: microeconomia.qmd
        text: Microeconomía
      - href: blog.qmd
        text: Blog
    right:
      - about.qmd
      - icon: github
        href: https://github.com/rneiraa
      - icon: bluesky
        href: https://bsky.app/
lang: es

format:
  html:
    # darkly = base oscura de Bootstrap; claret.scss encima la repinta.
    # (Bajo 'dark:' Quarto añadiría un conmutador claro/oscuro y un tema
    # claro sin estilar, así que va como tema único.)
    theme:
      - darkly
      - claret.scss
    css: styles.css
    highlight-style: claret.theme
    code-overflow: wrap
    code-copy: true
    # Ancho de la grilla: afecta banner, cuerpo y márgenes a la vez,
    # así todo queda alineado (por defecto el cuerpo son 800px)
    # 800px a 1.05rem en serif deja una medida de ~80 caracteres,
    # que es donde la lectura larga se mantiene cómoda.
    grid:
      body-width: 800px
      margin-width: 240px
      gutter-width: 1.5rem
    toc-title: "En esta página"
